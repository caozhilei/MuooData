# Global Mysql、Redis and RabbitMQ connect configuration items for Docker
common:
  rabbitmq:
    host: rabbitmq
    username: root
    password: 123456
    port: 5672
  redis:
    host: redis
    password: 123456
    port: 6379
  mysql:
    primary:
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: root
      password: 123456
      url: jdbc:mysql://mysql:3306/alldata?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    master:
      driver-class-name: com.mysql.cj.jdbc.Driver
      driver: com.mysql.cj.jdbc.Driver
      username: root
      password: 123456
      url: jdbc:mysql://mysql:3306/alldata?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    flowable:
      username: root
      password: 123456
      url: jdbc:mysql://mysql:3306/alldata?useUnicode=true&characterEncoding=utf8mb4&characterSetResults=utf8mb4&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true
    quartz:
      username: root
      password: 123456
      url: jdbc:mysql://mysql:3306/alldata?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    druid:
      username: root
      password: 123456
      url: jdbc:mysql://mysql:3306/alldata?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    dts:
      driver-class-name: com.mysql.jdbc.Driver
      username: root
      password: 123456
      url: jdbc:mysql://mysql:3306/alldata?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true

