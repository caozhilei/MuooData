spring:
  profiles:
    include: common-docker
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      discovery:
        locator:
          enabled: true
          lower-case-service-id: false
      routes:
        # 系统基础设置中心
        - id: service-system
          uri: lb://SERVICE-SYSTEM
          predicates:
            - Path=/system/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /system/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: systemHystrix
                fallbackUri: forward:/fallback
        # 系统基础设置中心 WebSocket
        - id: service-system-ws
          uri: lb:ws://SERVICE-SYSTEM
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=1
        # 邮件中心
        - id: service-email
          uri: lb://service-email
          predicates:
            - Path=/email/**
          filters:
            - SwaggerHeaderFilter
            - StripPrefix=1
            - name: Hystrix
              args:
                name: emailHystrix
                fallbackUri: forward:/fallback
        # 文件中心
        - id: service-file
          uri: lb://service-file
          predicates:
            - Path=/file/**
          filters:
            - SwaggerHeaderFilter
            - StripPrefix=1
            - name: Hystrix
              args:
                name: fileHystrix
                fallbackUri: forward:/fallback
        # 元数据管理
        - id: service-data-metadata
          uri: lb://service-data-metadata
          predicates:
            - Path=/data/metadata/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/metadata/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataMetadataHystrix
                fallbackUri: forward:/fallback
        # 数据SQL工作台
        - id: service-data-console
          uri: lb://service-data-console
          predicates:
            - Path=/data/console/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/console/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataSqlConsoleHystrix
                fallbackUri: forward:/fallback
        # 数据集市中心
        - id: service-data-market
          uri: lb://SERVICE-DATA-MARKET
          predicates:
            - Path=/data/market/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/market/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataMarketHystrix
                fallbackUri: forward:/fallback
        # 数据API注册
        - id: service-data-mapping
          uri: lb://service-data-mapping
          predicates:
            - Path=/data/api/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/api/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataApiMappingHystrix
                fallbackUri: forward:/fallback
        # 数据服务集成
        - id: service-data-integration
          uri: lb://service-data-integration
          predicates:
            - Path=/data/service/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/service/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataIntegrationHystrix
                fallbackUri: forward:/fallback
        # 数据可视化
        - id: service-data-visual
          uri: lb://SERVICE-DATA-VISUAL
          predicates:
            - Path=/data/visual/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/visual/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataVisualHystrix
                fallbackUri: forward:/fallback
        # 主数据
        - id: service-data-masterdata
          uri: lb://SERVICE-DATA-MASTERDATA
          predicates:
            - Path=/data/masterdata/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/masterdata/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataMasterdataHystrix
                fallbackUri: forward:/fallback
        # 数据质量
        - id: service-data-quality
          uri: lb://SERVICE-DATA-QUALITY
          predicates:
            - Path=/data/quality/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/quality/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataQualityHystrix
                fallbackUri: forward:/fallback
        # 数据标准
        - id: service-data-standard
          uri: lb://SERVICE-DATA-STANDARD
          predicates:
            - Path=/data/standard/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/standard/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataStandardHystrix
                fallbackUri: forward:/fallback
        # data-system
        - id: service-data-system
          uri: lb://DATA-SYSTEM-SERVICE
          predicates:
            - Path=/data/system/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/system/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
