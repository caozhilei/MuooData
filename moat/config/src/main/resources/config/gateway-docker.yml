                name: dataCompareHystrix
                fallbackUri: forward:/fallback
        # 定时任务
        - id: service-quartz
          uri: lb://service-quartz
          predicates:
            - Path=/quartz/**
          filters:
            - SwaggerHeaderFilter
            - StripPrefix=1
