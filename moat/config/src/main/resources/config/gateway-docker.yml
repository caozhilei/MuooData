              args:
                name: quartzHystrix
                fallbackUri: forward:/fallback
        # 代码生成器
        - id: service-codegen
          uri: lb://service-codegen
          predicates:
            - Path=/codegen/**
          filters:
            - SwaggerHeaderFilter
            - StripPrefix=1
            - name: Hystrix
              args:
                name: codegenHystrix
                fallbackUri: forward:/fallback
        # 数据集成
        - id: service-data-dts
          uri: lb://service-data-dts
          predicates:
            - Path=/data/dts/**
          filters:
            - SwaggerHeaderFilter
            - name: RewritePath
              args:
                regexp: /data/dts/(?<segment>.*)
                replacement: /${segment}
            - name: Hystrix
              args:
                name: dataSystemHystrix
                fallbackUri: forward:/fallback
        # 工作流服务（集成在data-system-service中）
        - id: service-workflow
          uri: lb://DATA-SYSTEM-SERVICE
          predicates:
            - Path=/workflow/**
          filters:
            - SwaggerHeaderFilter
