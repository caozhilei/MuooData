# 数据源配置
spring:
  profiles:
    include: common-docker
  redis:
    database: 1
    host: ${common.redis.host}
    port: ${common.redis.port}
    password: ${common.redis.password}  # 密码（默认为空）
    timeout: 6000ms       # 连接超时时长（毫秒）
    jedis:
      pool:
        max-active: 1000  # 连接池最大连接数（使用负值表示没有限制）
        max-wait: -1ms    # 连接池最大阻塞等待时间（使用负值表示没有限制）
        max-idle: 10      # 连接池中的最大空闲连接
        min-idle: 5       # 连接池中的最小空闲连接
  datasource:
    dynamic:
      primary: master
      strict: false
      datasource:
        master:
          driver-class-name: ${common.mysql.master.driver}
          url: ${common.mysql.master.url}
          username: ${common.mysql.master.username}
          password: ${common.mysql.master.password}

mybatis-plus:
  mapper-locations: classpath*:mapper/*Mapper.xml
  type-aliases-package: cn.datax.service.data.metadata.api.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      select-strategy: not_empty
      insert-strategy: not_empty
      update-strategy: not_empty
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Swagger界面内容配置
swagger:
  enable: true

