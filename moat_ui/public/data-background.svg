<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1f3a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="gridGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:0.1" />
    </linearGradient>
    
    <radialGradient id="glowGradient" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#4A90E2;stop-opacity:0" />
    </radialGradient>
    
    <!-- 动画定义 -->
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-20px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes flow {
        0% { transform: translateX(-100px); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translateX(1920px); opacity: 0; }
      }
      .float { animation: float 6s ease-in-out infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      .flow { animation: flow 15s linear infinite; }
    </style>
  </defs>
  
  <!-- 背景 -->
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- 网格线 -->
  <g opacity="0.2">
    <defs>
      <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
        <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#4A90E2" stroke-width="0.5"/>
      </pattern>
    </defs>
    <rect width="1920" height="1080" fill="url(#grid)"/>
  </g>
  
  <!-- 数据节点 -->
  <circle cx="200" cy="300" r="4" fill="#4A90E2" class="pulse" opacity="0.8"/>
  <circle cx="500" cy="150" r="3" fill="#50C878" class="pulse" opacity="0.7" style="animation-delay: 1s"/>
  <circle cx="800" cy="400" r="5" fill="#FF6B6B" class="pulse" opacity="0.6" style="animation-delay: 2s"/>
  <circle cx="1200" cy="250" r="4" fill="#FFA726" class="pulse" opacity="0.7" style="animation-delay: 0.5s"/>
  <circle cx="1500" cy="500" r="3" fill="#AB47BC" class="pulse" opacity="0.8" style="animation-delay: 1.5s"/>
  <circle cx="300" cy="700" r="4" fill="#4A90E2" class="pulse" opacity="0.6" style="animation-delay: 2.5s"/>
  <circle cx="700" cy="800" r="3" fill="#50C878" class="pulse" opacity="0.7" style="animation-delay: 1s"/>
  <circle cx="1100" cy="650" r="5" fill="#FF6B6B" class="pulse" opacity="0.8" style="animation-delay: 0.8s"/>
  <circle cx="1400" cy="900" r="4" fill="#FFA726" class="pulse" opacity="0.6" style="animation-delay: 1.2s"/>
  <circle cx="1700" cy="750" r="3" fill="#AB47BC" class="pulse" opacity="0.7" style="animation-delay: 2s"/>
  
  <!-- 连接线 -->
  <line x1="200" y1="300" x2="500" y2="150" stroke="#4A90E2" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="150" x2="800" y2="400" stroke="#50C878" stroke-width="1" opacity="0.3"/>
  <line x1="800" y1="400" x2="1200" y2="250" stroke="#FF6B6B" stroke-width="1" opacity="0.3"/>
  <line x1="1200" y1="250" x2="1500" y2="500" stroke="#FFA726" stroke-width="1" opacity="0.3"/>
  <line x1="300" y1="700" x2="700" y2="800" stroke="#4A90E2" stroke-width="1" opacity="0.3"/>
  <line x1="700" y1="800" x2="1100" y2="650" stroke="#50C878" stroke-width="1" opacity="0.3"/>
  <line x1="1100" y1="650" x2="1400" y2="900" stroke="#FF6B6B" stroke-width="1" opacity="0.3"/>
  <line x1="1400" y1="900" x2="1700" y2="750" stroke="#FFA726" stroke-width="1" opacity="0.3"/>
  
  <!-- 数据流动效果 -->
  <circle cx="0" cy="300" r="3" fill="#4A90E2" class="flow" opacity="0.8"/>
  <circle cx="0" cy="500" r="2" fill="#50C878" class="flow" opacity="0.7" style="animation-delay: 3s; animation-duration: 18s"/>
  <circle cx="0" cy="700" r="3" fill="#FF6B6B" class="flow" opacity="0.6" style="animation-delay: 6s; animation-duration: 20s"/>
  <circle cx="0" cy="200" r="2" fill="#FFA726" class="flow" opacity="0.7" style="animation-delay: 9s; animation-duration: 16s"/>
  
  <!-- 光晕效果 -->
  <circle cx="960" cy="540" r="300" fill="url(#glowGradient)" class="pulse"/>
</svg>

