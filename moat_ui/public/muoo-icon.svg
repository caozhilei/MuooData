<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="iconGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50C878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3FA863;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55555;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="iconGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#AB47BC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E24AA;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="iconShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1.5" dy="1.5" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="120" height="120" rx="24" fill="#FFFFFF"/>
  
  <!-- 积木块1 - 左下 -->
  <g transform="translate(20, 70)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#iconGrad1)" filter="url(#iconShadow)"/>
    <rect x="1" y="1" width="14" height="14" rx="1.5" fill="url(#iconGrad1)" opacity="0.9"/>
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 积木块2 - 左侧中间 -->
  <g transform="translate(20, 50)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#iconGrad2)" filter="url(#iconShadow)"/>
    <rect x="1" y="1" width="14" height="14" rx="1.5" fill="url(#iconGrad2)" opacity="0.9"/>
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 积木块3 - 左侧上方 -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#iconGrad3)" filter="url(#iconShadow)"/>
    <rect x="1" y="1" width="14" height="14" rx="1.5" fill="url(#iconGrad3)" opacity="0.9"/>
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 积木块4 - 中间下方 -->
  <g transform="translate(44, 70)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#iconGrad4)" filter="url(#iconShadow)"/>
    <rect x="1" y="1" width="14" height="14" rx="1.5" fill="url(#iconGrad4)" opacity="0.9"/>
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 积木块5 - 中间上方 -->
  <g transform="translate(44, 30)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#iconGrad5)" filter="url(#iconShadow)"/>
    <rect x="1" y="1" width="14" height="14" rx="1.5" fill="url(#iconGrad5)" opacity="0.9"/>
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 积木块6 - 右侧下方 -->
  <g transform="translate(68, 70)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#iconGrad1)" filter="url(#iconShadow)"/>
    <rect x="1" y="1" width="14" height="14" rx="1.5" fill="url(#iconGrad1)" opacity="0.9"/>
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 积木块7 - 右侧中间 -->
  <g transform="translate(68, 50)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#iconGrad2)" filter="url(#iconShadow)"/>
    <rect x="1" y="1" width="14" height="14" rx="1.5" fill="url(#iconGrad2)" opacity="0.9"/>
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 积木块8 - 右侧上方 -->
  <g transform="translate(68, 30)">
    <rect x="0" y="0" width="16" height="16" rx="2" fill="url(#iconGrad3)" filter="url(#iconShadow)"/>
    <rect x="1" y="1" width="14" height="14" rx="1.5" fill="url(#iconGrad3)" opacity="0.9"/>
    <circle cx="8" cy="8" r="1.5" fill="#FFFFFF" opacity="0.7"/>
  </g>
  
  <!-- 连接线 -->
  <g stroke="#4A90E2" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.3" fill="none">
    <path d="M 36 78 Q 50 70, 52 78"/>
    <path d="M 36 58 Q 50 50, 52 58"/>
    <path d="M 36 38 Q 50 30, 52 38"/>
    <path d="M 60 78 Q 64 70, 68 78"/>
    <path d="M 60 38 Q 64 30, 68 38"/>
  </g>
</svg>

