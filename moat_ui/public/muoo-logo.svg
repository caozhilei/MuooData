<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- 渐变定义 -->
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50C878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3FA863;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55555;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFA726;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#AB47BC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8E24AA;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影滤镜 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="120" cy="120" r="110" fill="#F5F7FA" stroke="#E1E8ED" stroke-width="2"/>
  
  <!-- 积木块1 - 左下角，蓝色 -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="url(#gradient1)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#gradient1)" opacity="0.8"/>
    <!-- 连接点 -->
    <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- 积木块2 - 左侧中间，绿色 -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="url(#gradient2)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#gradient2)" opacity="0.8"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- 积木块3 - 左侧上方，红色 -->
  <g transform="translate(40, 60)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="url(#gradient3)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#gradient3)" opacity="0.8"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- 积木块4 - 中间下方，橙色 -->
  <g transform="translate(88, 140)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="url(#gradient4)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#gradient4)" opacity="0.8"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- 积木块5 - 中间上方，紫色 -->
  <g transform="translate(88, 60)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="url(#gradient5)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#gradient5)" opacity="0.8"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- 积木块6 - 右侧下方，蓝色 -->
  <g transform="translate(136, 140)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="url(#gradient1)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#gradient1)" opacity="0.8"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- 积木块7 - 右侧中间，绿色 -->
  <g transform="translate(136, 100)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="url(#gradient2)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#gradient2)" opacity="0.8"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- 积木块8 - 右侧上方，红色 -->
  <g transform="translate(136, 60)">
    <rect x="0" y="0" width="32" height="32" rx="4" fill="url(#gradient3)" filter="url(#shadow)"/>
    <rect x="2" y="2" width="28" height="28" rx="3" fill="url(#gradient3)" opacity="0.8"/>
    <circle cx="16" cy="16" r="3" fill="#FFFFFF" opacity="0.6"/>
  </g>
  
  <!-- 连接线 - 体现数据流 -->
  <g stroke="#4A90E2" stroke-width="2" stroke-dasharray="4,2" opacity="0.4" fill="none">
    <path d="M 72 156 Q 100 140, 104 156"/>
    <path d="M 72 116 Q 100 100, 104 116"/>
    <path d="M 72 76 Q 100 60, 104 76"/>
    <path d="M 120 156 Q 128 140, 136 156"/>
    <path d="M 120 76 Q 128 60, 136 76"/>
  </g>
  
  <!-- 文字标识 -->
  <text x="120" y="200" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50" text-anchor="middle">Muoo</text>
  <text x="120" y="220" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D" text-anchor="middle">数据中台</text>
</svg>

